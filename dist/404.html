<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Celestial Good</title>
    <meta name="description" content="The page you are looking for doesn't exist or has been moved. Return to the homepage of Celestial Good — organic and artisanal delicacies.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="assets/brochure.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <style>
      .page-404 {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 70vh;
        text-align: center;
        padding: 48px 20px;
      }
      .page-404-inner {
        max-width: 500px;
      }
      .page-404 h1 {
        font-size: 8rem;
        line-height: 1;
        color: var(--gold);
        margin-bottom: 8px;
        font-family: 'Cormorant Garamond', serif;
      }
      .page-404 h2 {
        font-size: 1.5rem;
        margin-bottom: 12px;
        color: var(--green-dark, #1C1C1A);
      }
      .page-404 p {
        color: var(--text-soft, #666);
        margin-bottom: 28px;
        font-size: 1.1rem;
      }
      .page-404 .btn {
        margin: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="page-404">
        <div class="page-404-inner">
          <h1>404</h1>
          <h2>Page Not Found</h2>
          <p>Looks like this page has wandered off. Don't worry, it happens sometimes.</p>
          <a href="/" class="btn btn-gold btn-lg">Back to Home</a>
          <a href="/shop.html" class="btn btn-outline btn-lg">Browse Products</a>
          <p style="margin-top: 24px; font-size: 0.9rem; color: #999;">
            If you believe this is an error, <a href="mailto:Sumit@celestialgood.com">contact us</a>.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
